name: Release device builds
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Release artifacts (Android signed; iOS requires user re-signing)
        required: true
        type: choice
        options: [android, ios, both]
        default: both
permissions:
  contents: read
concurrency:
  group: mobile-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: true
jobs:
  android:
    if: inputs.platform == 'android' || inputs.platform == 'both'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore private test-release keystore
        env:
          ANDROID_RELEASE_STORE_BASE64: ${{ secrets.ANDROID_RELEASE_STORE_BASE64 }}
        run: |
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          target = Path(os.environ['RUNNER_TEMP']) / 'ohmydrift-release.p12'
          target.write_bytes(base64.b64decode(os.environ['ANDROID_RELEASE_STORE_BASE64'], validate=True))
          target.chmod(0o600)
          PY
      - name: Build signed Release APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/ohmydrift-release.p12
          ANDROID_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ANDROID_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ANDROID_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :androidApp:assembleRelease :androidApp:bundleRelease --stacktrace
      - name: Verify signatures and collect Release artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/release/android
          apk=(androidApp/build/outputs/apk/release/*.apk)
          aab=(androidApp/build/outputs/bundle/release/*.aab)
          test "${#apk[@]}" -eq 1 && test -f "${apk[0]}"
          test "${#aab[@]}" -eq 1 && test -f "${aab[0]}"
          "$ANDROID_HOME/build-tools/37.0.0/apksigner" verify --verbose --print-certs "${apk[0]}" | tee build/release/android/signature.txt
          "$ANDROID_HOME/build-tools/37.0.0/aapt" dump badging "${apk[0]}" > "$RUNNER_TEMP/apk-badging.txt"
          if rg -q '^application-debuggable' "$RUNNER_TEMP/apk-badging.txt"; then
            echo 'Refusing to publish a debuggable APK'; exit 1
          fi
          jarsigner -verify "${aab[0]}" | tee "$RUNNER_TEMP/bundle-verification.txt"
          rg -q 'jar verified' "$RUNNER_TEMP/bundle-verification.txt"
          cp "${apk[0]}" build/release/android/ohmydrift-release.apk
          cp "${aab[0]}" build/release/android/ohmydrift-release.aab
          (cd build/release/android && sha256sum *.apk *.aab > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: ohmydrift-android-release
          path: build/release/android/
          if-no-files-found: error
          retention-days: 7
      - name: Remove restored keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/ohmydrift-release.p12"
  ios:
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      # The Android shared target is configured even during an iOS build.
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-37.0' 'build-tools;37.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - run: xcodebuild -version
      - name: Archive unsigned arm64 iPhoneOS Release app
        run: >-
          xcodebuild -project iosApp/iosApp.xcodeproj
          -scheme iosApp -configuration Release
          -sdk iphoneos -arch arm64
          -destination 'generic/platform=iOS'
          -archivePath build/ios-device/ohmydrift.xcarchive
          -derivedDataPath build/ios-device/DerivedData
          IPHONEOS_DEPLOYMENT_TARGET=16.0
          PRODUCT_BUNDLE_IDENTIFIER=dev.ohmydrift.app
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO
          CODE_SIGN_IDENTITY='' DEVELOPMENT_TEAM=''
          DEBUG_INFORMATION_FORMAT=dwarf-with-dsym
          SKIP_INSTALL=NO archive
      - name: Validate and package device IPA and archive
        run: |
          python3 tools/package_ios_release.py build/ios-device/ohmydrift.xcarchive build/release/ios
          (cd build/release/ios && shasum -a 256 *.ipa *.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: ohmydrift-ios-release-unsigned
          path: build/release/ios/
          if-no-files-found: error
          retention-days: 7
